# Deliberately tiny.
#
# `use_default_settings` inherits everything SearXNG ships with, so engine
# definitions, categories and defaults keep following upstream instead of being
# frozen here. Only settings that cannot be expressed another way belong below;
# anything added here is a thing that stops tracking upstream.
use_default_settings: true

server:
  # SEARXNG_SECRET is substituted from the environment at deploy time.
  secret_key: "${SEARXNG_SECRET}"
  # The bot limiter exists to protect a public instance. This one is only
  # reachable from inside the compose network, and the limiter would reject
  # our own API calls.
  limiter: false
  public_instance: false

search:
  # The single setting that forces this file to exist: `formats` defaults to
  # [html] and has no environment-variable override, so without this line
  # `format=json` is answered with 403 Forbidden.
  formats:
    - html
    - json

# Which engines run. Nothing here defines an engine; each entry flips the
# `disabled` flag on a definition that stays upstream's, so a new release still
# decides what these engines are and how they are queried.
#
# The section exists because upstream's defaults do not survive contact with
# this deployment. Upstream enables four general web engines - brave,
# duckduckgo, google cse and startpage - and ships google and bing switched
# off. What remains is `google cse` and `duckduckgo web`. Measured against this
# deployment's own egress with searxng 2026.10.7-6671d89be: `/stats/errors` on
# the running instance, and each engine's request replayed from inside the
# container with the same curl_cffi client (startpage and duckduckgo were last
# measured on 2026-09-01, the rest on 2026-10-18):
#
#   startpage       answered every request with /sp/captcha-block?bc=JP. Same
#                   answer for SearXNG's user agent and a current Chrome one,
#                   and over both HTTP/1.1 and h2, so it is a block on the
#                   egress country rather than anything about the request.
#                   Nothing in this file can lift it. PROXY_URL can: compose
#                   passes it to this container as HTTP(S)_PROXY, so a relay
#                   outside JP is the one thing that makes startpage usable
#                   here - flip it back on at the same time.
#   duckduckgo      answered HTTP 202 with a challenge form. SearXNG's user
#                   agent pool (searx/data/useragents.json) carries Firefox
#                   builds only and search/processors/online.py sets the header
#                   unconditionally, so no setting reaches it. `duckduckgo web`
#                   is the same operator over a different endpoint and answers
#                   normally, so that is the one that runs.
#   google          403 on every request (100% access denied). Google refuses
#                   the /wml/search endpoint the engine relies on, whatever the
#                   locale, user agent or TLS fingerprint - an upstream-wide
#                   breakage, not this egress:
#                   https://github.com/searxng/searxng/issues/6835
#   brave           429 on every request. brave.py forces
#                   `Accept-Encoding: gzip, deflate` on top of Chrome
#                   impersonation and Brave flags the mismatch; the same request
#                   without that header got 200. Even then the engine finds
#                   nothing, because the page no longer carries the `data: [{`
#                   its parser looks for:
#                   https://github.com/searxng/searxng/issues/6819
#   bing            answers, but with the wrong market. With no language set
#                   SearXNG sends neither `setlang` nor `cc`, and never sends
#                   `cc=us` at all, so Bing picks the market from the JP egress
#                   and English queries come back as Japanese dictionary pages.
#                   It costs relevance rather than failing, which is worse.
#
# Re-enable google or brave when a release fixes the issue linked above, and
# re-run the measurement first: these are observations and they go stale.
engines:
  - name: google
    disabled: true
  - name: bing
    disabled: true
  - name: brave
    disabled: true
  - name: duckduckgo web
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
