# Fixture site for the contract tests. Serves tests/fixtures/site as before,
# plus four endpoints for the login session tests (specs/006): one sets a
# cookie, one echoes it back, and a members page redirects to a sign-in page.
server {
    listen 80;
    # The image adds this line itself only to its own default.conf; this file
    # replaces that one, and the healthcheck's "localhost" resolves to ::1.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers, so a redirect keeps whatever host and port
    # the test reached this server by.
    absolute_redirect off;

    location = /session/set {
        add_header Set-Cookie "c4ai_session_probe=ok; Path=/; Max-Age=86400; HttpOnly" always;
        default_type text/html;
        return 200 "<!doctype html><html><head><title>Session set</title></head><body><h1>Session set</h1><p>The probe cookie has been stored by this browser profile.</p></body></html>";
    }

    location = /session/check {
        default_type text/html;
        return 200 "<!doctype html><html><head><title>Session check</title></head><body><h1>Session check</h1><p>probe=[$cookie_c4ai_session_probe]</p></body></html>";
    }

    location = /session/members {
        return 302 /account/signin?return_to=%2Fsession%2Fmembers;
    }

    location = /account/signin {
        default_type text/html;
        return 200 "<!doctype html><html><head><title>Sign in</title></head><body><h1>Sign in</h1><form><input name=email><input type=password name=password></form></body></html>";
    }
}
