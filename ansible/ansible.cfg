[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
vault_password_file = ~/.ansible/vault_pass

[ssh_connection]
# Without pipelining every task costs four or five SSH sessions. On a
# low-power target that is the difference between a deploy that takes a minute
# and one that takes several.
pipelining = true
