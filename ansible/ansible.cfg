[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# YAML-formatted task results. `stdout_callback = yaml` resolved to
# community.general.yaml, which that collection removed in version 12, and
# ansible-core then refuses to start the playbook at all.
stdout_callback = default
result_format = yaml
vault_password_file = ~/.ansible/vault_pass

[ssh_connection]
# Without pipelining every task costs four or five SSH sessions. On a
# low-power target that is the difference between a deploy that takes a minute
# and one that takes several.
pipelining = true
