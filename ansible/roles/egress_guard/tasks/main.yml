---
# Blocks the scraping containers from reaching the local network.
#
# This is the layer that actually holds. The check inside the MCP server
# resolves a hostname and refuses private addresses, which gives the caller a
# precise error - but a name can resolve differently a moment later, and no
# application-level check closes that window. A packet filter does.
#
# Rules go in DOCKER-USER because Docker consults it before its own rules and
# does not flush it on restart.

- name: Ensure iptables is present
  ansible.builtin.package:
    name: iptables
    state: present
  become: true
  tags: [egress_guard, security]

- name: Take the stack subnet from versions.env
  ansible.builtin.set_fact:
    egress_guard_source_subnet: >-
      {{ lookup('ansible.builtin.ini', 'STACK_SUBNET',
                file=mcp_local_env_file | dirname + '/versions.env',
                type='properties', errors='ignore')
         | default(egress_guard_source_subnet, true) }}
  tags: [egress_guard, security]

- name: Confirm the DOCKER-USER chain exists
  ansible.builtin.command:
    cmd: iptables -t filter -L DOCKER-USER -n
  become: true
  register: docker_user_chain
  changed_when: false
  failed_when: false
  tags: [egress_guard, security]

- name: Fail when Docker has not created its hook chain
  ansible.builtin.assert:
    that: docker_user_chain.rc == 0
    fail_msg: >-
      The DOCKER-USER chain does not exist, so there is nowhere to install the
      egress rules. Docker creates it when it manages iptables; check that
      iptables handling is not disabled in /etc/docker/daemon.json.
  tags: [egress_guard, security]

# xt_comment is not present on every kernel - it is missing on some minimal
# server builds - and iptables reports its absence as a confusing
# "No such file or directory" against the chain. Detect it once rather than
# letting a label decide whether the firewall gets configured at all.
- name: Check whether iptables can label rules
  ansible.builtin.shell:
    cmd: |
      set -e
      iptables -t filter -N MCP_COMMENT_PROBE 2>/dev/null || true
      rc=0
      iptables -t filter -A MCP_COMMENT_PROBE -j RETURN -m comment --comment probe 2>/dev/null || rc=$?
      iptables -t filter -F MCP_COMMENT_PROBE 2>/dev/null || true
      iptables -t filter -X MCP_COMMENT_PROBE 2>/dev/null || true
      exit $rc
  become: true
  register: comment_supported
  changed_when: false
  failed_when: false
  tags: [egress_guard, security]

- name: Note that rules will be unlabelled on this kernel
  ansible.builtin.debug:
    msg: >-
      This kernel has no xt_comment module, so the egress rules are installed
      without a comment. They are still enforced; they are simply harder to
      recognise in `iptables -S DOCKER-USER`.
  when: comment_supported.rc != 0
  tags: [egress_guard, security]

- name: Install the script that applies the egress rules
  ansible.builtin.template:
    src: mcp-egress-guard.sh.j2
    dest: /usr/local/sbin/mcp-egress-guard
    owner: root
    group: root
    mode: "0750"
  become: true
  notify: Reapply the egress rules
  tags: [egress_guard, security]

- name: Install the unit that applies them after Docker starts
  ansible.builtin.template:
    src: mcp-egress-guard.service.j2
    dest: /etc/systemd/system/mcp-egress-guard.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reapply the egress rules
  tags: [egress_guard, security]

- name: Enable the unit so the rules return after a reboot
  ansible.builtin.systemd:
    name: mcp-egress-guard.service
    enabled: true
    daemon_reload: true
  become: true
  when: not ansible_check_mode
  tags: [egress_guard, security]

# Apply now rather than at the end of the play: the stack must not run
# unfiltered while later roles work.
- name: Apply the rules now
  ansible.builtin.meta: flush_handlers
  tags: [egress_guard, security]

- name: Make sure the unit is active
  ansible.builtin.systemd:
    name: mcp-egress-guard.service
    state: started
  become: true
  when: not ansible_check_mode
  tags: [egress_guard, security]
