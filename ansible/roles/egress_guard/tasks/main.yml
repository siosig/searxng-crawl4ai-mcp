---
# Blocks the scraping containers from reaching the local network and the host.
#
# This is the layer that actually holds. The check inside the MCP server
# resolves a hostname and refuses private addresses, which gives the caller a
# precise error - but a name can resolve differently a moment later, and no
# application-level check closes that window. A packet filter does.
#
# The rules are applied by a unit that runs before docker.service, because
# dockerd starts containers before it reports ready. They live in Docker's
# blind spots - an nftables table of their own and an iptables chain jumped to
# from INPUT - so Docker neither needs to exist first nor rewrites them.

- name: Ensure iptables and nftables are present
  ansible.builtin.package:
    name: [iptables, nftables]
    state: present
  become: true
  tags: [egress_guard, security]

- name: Take the stack subnet from versions.env
  ansible.builtin.set_fact:
    egress_guard_source_subnet: >-
      {{ lookup('ansible.builtin.ini', 'STACK_SUBNET',
                file=mcp_local_env_file | dirname + '/versions.env',
                type='properties', errors='ignore')
         | default(egress_guard_source_subnet, true) }}
  tags: [egress_guard, security]

- name: Install the nftables ruleset for routed traffic
  ansible.builtin.template:
    src: mcp-egress-guard.nft.j2
    dest: /etc/mcp-egress-guard.nft
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  become: true
  notify: Reapply the egress rules
  tags: [egress_guard, security]

- name: Install the script that applies the egress rules
  ansible.builtin.template:
    src: mcp-egress-guard.sh.j2
    dest: /usr/local/sbin/mcp-egress-guard
    owner: root
    group: root
    mode: "0750"
  become: true
  notify: Reapply the egress rules
  tags: [egress_guard, security]

- name: Install the unit that applies them before Docker starts
  ansible.builtin.template:
    src: mcp-egress-guard.service.j2
    dest: /etc/systemd/system/mcp-egress-guard.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reapply the egress rules
  tags: [egress_guard, security]

- name: Ensure the docker.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [egress_guard, security]

# Fail closed: with the rules missing, Docker stays down rather than running
# the stack unfiltered. Takes effect the next time Docker starts; Docker is not
# restarted here.
- name: Make Docker require the egress rules
  ansible.builtin.template:
    src: docker-mcp-egress-guard.conf.j2
    dest: /etc/systemd/system/docker.service.d/mcp-egress-guard.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd units
  tags: [egress_guard, security]

- name: Enable the unit so the rules return after a reboot
  ansible.builtin.systemd:
    name: mcp-egress-guard.service
    enabled: true
    daemon_reload: true
  become: true
  when: not ansible_check_mode
  tags: [egress_guard, security]

# Apply now rather than at the end of the play: the stack must not run
# unfiltered while later roles work.
- name: Apply the rules now
  ansible.builtin.meta: flush_handlers
  tags: [egress_guard, security]

- name: Make sure the unit is active
  ansible.builtin.systemd:
    name: mcp-egress-guard.service
    state: started
  become: true
  when: not ansible_check_mode
  tags: [egress_guard, security]

# Earlier versions put the rules in DOCKER-USER, labelled with a comment only
# where the kernel has xt_comment, so both forms are removed. Removed only now,
# with the replacement already active. An absent rule or chain is a no-op, so
# these two tasks can go once no host still has the old rules.
- name: Remove the DOCKER-USER drop rules earlier versions installed
  ansible.builtin.iptables:
    chain: DOCKER-USER
    source: "{{ egress_guard_source_subnet }}"
    destination: "{{ item.0 }}"
    jump: DROP
    comment: "{{ item.1 | ternary(egress_guard_comment, omit) }}"
    state: absent
    wait: "5"
  loop: >-
    {{ egress_guard_blocked_destinations | product([false, true]) | list }}
  become: true
  tags: [egress_guard, security]

- name: Remove the DOCKER-USER exceptions earlier versions installed
  ansible.builtin.iptables:
    chain: DOCKER-USER
    source: "{{ egress_guard_source_subnet }}"
    destination: "{{ item.0 }}"
    jump: RETURN
    comment: "{{ item.1 | ternary(egress_guard_comment ~ ' (allowed)', omit) }}"
    state: absent
    wait: "5"
  loop: >-
    {{ egress_guard_allowed_destinations | product([false, true]) | list }}
  become: true
  tags: [egress_guard, security]
