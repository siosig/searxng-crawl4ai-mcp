---
mcp_deploy_dir: /opt/searxng-crawl4ai-mcp
mcp_port: 3003
mcp_allowed_hosts: "localhost,127.0.0.1"

# One browser per slot, so this is a memory and CPU budget rather than a
# politeness limit. The default suits a developer machine; a low-power target
# should override it downwards in host_vars rather than discovering the limit
# by running out of memory.
mcp_max_concurrent_fetches: 2

# Attempts against an upstream, including the first. Retrying only ever
# absorbs failures that came back quickly and never adds more than two seconds
# to a call, so the default is safe on a low-power host. Set it to 1 to switch
# retrying off and see every transient failure as it happens.
mcp_retry_max_attempts: 3

mcp_log_level: info
mcp_gemini_model: "gemini/gemini-flash-lite-latest"

# Extra CIDR ranges the scraper may reach. Empty by default: private,
# loopback, link-local and metadata ranges stay refused.
mcp_scrape_allow_cidrs: ""

# Path to the local .env holding the Gemini key, relative to the playbook.
mcp_local_env_file: "{{ playbook_dir }}/../.env"

# Metrics. Empty means the metrics overlay is not used at all, so no listener
# is created and no extra port is published - which is what a host with no
# monitoring stack should get.
mcp_metrics_port: ""

# Local-service access to the upstream containers. Empty means the overlay is
# not used at all - searxng and crawl4ai stay off the host entirely, which is
# the right default. Set both when another service on this host needs to talk
# to them directly (see docker/compose.local-services.yaml for what this opts
# out of).
mcp_local_searxng_port: ""
mcp_local_crawl4ai_port: ""

# Login sessions (specs/006-persistent-login-sessions). Empty root means the
# feature is off: the login-session overlay is not used and no login-session
# command is installed. The mountpoint, when set, must be mounted and must
# contain the root, so the store is never created on the root filesystem by a
# missing disk.
mcp_login_session_mountpoint: ""
mcp_login_session_root: ""

# The login browser is the host's own Chrome, run as mcp_login_user on the X
# display mcp_login_display, so nothing new listens on the network. Providing
# that display (and the way to see it) is left to the host; this stack only
# points the browser at it. The user is required when the root is set and must
# be one that may draw on the display.
mcp_login_user: ""
mcp_login_display: ":1"
mcp_login_browser: "/usr/bin/google-chrome"

# Owner (uid and gid) of the login session store: appuser in the crawl4ai
# image. Change it only when the image changes.
mcp_login_session_uid: 999
