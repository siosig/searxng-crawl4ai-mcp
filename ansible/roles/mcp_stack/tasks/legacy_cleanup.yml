---
# Removes the stack this project replaces. Not run by default: deleting a
# working deployment should be something the operator asks for by name, with
# `--tags legacy_cleanup`.
- name: Stop and remove the previous stack's containers
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
  loop:
    - searxng-crawl4ai-mcp-mcp-1
    - searxng-crawl4ai-mcp-searxng-1
    - searxng-crawl4ai-mcp-crawl4ai-1
    - searxng-crawl4ai-mcp-redis-1
  become: true
  tags: [legacy_cleanup, never]
